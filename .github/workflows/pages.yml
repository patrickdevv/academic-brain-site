name: Publicar páginas
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Preparar somente arquivos públicos
        run: |
          mkdir _site
          cp index.html style.css .nojekyll _site/
          cp -R privacidade termos _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
